[env:esp32-s3-devkitc-1-n32-r16]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
lib_deps = h2zero/esp-nimble-cpp@^2.5.0


; board_build.arduino.memory_type = opi_opi
; board_build.flash_mode = opi
; board_build.psram_type = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
monitor_speed = 115200
board_build.f_cpu = 80000000L

monitor_filters = esp32_exception_decoder

build_flags =
  -D CONFIG_NIMBLE_CPP_IDF
  -D CONFIG_BT_NIMBLE_ENABLED
  -D CONFIG_BT_NIMBLE_EXT_ADV
  -I.pio/packages/framework-espidf/components/bt/host/nimble/nimble/host/include
  -I.pio/packages/framework-espidf/components/bt/host/nimble/nimble/porting/nimble/include
  -I.pio/packages/framework-espidf/components/bt/host/nimble/port/include