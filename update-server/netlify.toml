[build]
  publish = "dist"
  functions = "functions"
  node_bundler = "esbuild"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "API_AUTH"

[functions]
  included_files = ["files/**"]

[[headers]]
  for = "/app-updates/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"